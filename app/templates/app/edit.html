<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
             <a class="navbar-brand" href="#">CRUD PROJECT</a>
        </div>
    </nav>
        <div class="container mt-3">
            <div class="row">
                <div class="col-md-4">
                    <h2 class="bg-dark text-white text-center p-3">insert student details</h2>
                    <form action="/update/{{d.id}}" method="post">{% csrf_token %}
                        <div>
                            <input type="text" class="form-control" placeholder="Enter the student name" name="name" value="{{d.name}}">
                        </div>
                        <div>
                            <input type="email" class="form-control" placeholder="Enter the student email" name="email" value="{{d.email}}">
                        </div>
                        <div>
                            <input type="number" class="form-control" placeholder="Enter the student age" name="age" value="{{d.age}}">
                        </div>
                        <div>
                            <select name="gender" class="form-control" id="gender">
                                <option selected>{{d.gender}}</option>
                                <option alue="male ">Male</option>
                                <option value="female">Female</option>
                            </select>
                        </div>
                        <div>
                            <button class="btn btn-success" w-100>Submit</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
